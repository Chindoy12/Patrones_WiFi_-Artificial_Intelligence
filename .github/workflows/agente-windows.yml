# Builds the Windows installer of the agent (WiFiSenseAgente.exe) with PyInstaller and publishes it in the release
# "agente", which is the link Mi Wi-Fi offers for download. Runs when the agent changes on main, or by hand.
name: Agente para Windows

on:
  push:
    branches: [main]
    paths: ["agent/**", ".github/workflows/agente-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probar el agente
        run: |
          python -m pip install pytest==8.3.4
          python -m pytest --noconftest -q tests/test_agent.py tests/test_windows_install.py

      - name: Construir WiFiSenseAgente.exe
        run: |
          python -m pip install pyinstaller==6.11.1
          pyinstaller --onefile --noconsole --name WiFiSenseAgente --paths agent agent/app.py

      - name: Comprobar que el programa arranca
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\WiFiSenseAgente.exe -ArgumentList "pair","X" -PassThru -Wait
          if ($p.ExitCode -ne 1) { throw "exit code $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: WiFiSenseAgente
          path: dist/WiFiSenseAgente.exe

      - name: Publicar en la versión "agente"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agente
          name: Agente WiFiSense para Windows
          body: |
            Instalador del agente WiFiSense para Windows 10 y 11. Descárgalo desde Mi Wi-Fi > Agente WiFiSense,
            ábrelo con doble clic y pega el código de instalación.
          files: dist/WiFiSenseAgente.exe
          make_latest: false
